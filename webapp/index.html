<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Disease Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    input[type="file"] {
      margin-top: 10px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      background-color: #6c757d;
    }
    .result {
      margin-top: 20px;
      text-align: left;
    }
    .probability {
      margin-left: 15px;
      color: #555;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Skin Disease Classifier</h2>
    <p>Select a skin lesion image to classify.  The prediction is for research purposes only and not a medical diagnosis.</p>
    <input id="file-input" type="file" accept="image/*">
    <br>
    <button id="submit-btn" disabled>Predict</button>
    <div id="output" class="result"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
